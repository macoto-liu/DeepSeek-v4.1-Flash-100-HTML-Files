<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marble Run — A study in gravity, taking its time</title>
<style>
  :root{
    --cream:#f4ecd8;
    --cream-deep:#e9ddc2;
    --ink:#171512;
    --cobalt:#2541c4;
    --vermilion:#e94a2b;
    --mustard:#e6b32c;
    --rule:rgba(23,21,18,.22);
    --mono:"SFMono-Regular",Menlo,Consolas,"Liberation Mono",monospace;
    --sans:"Helvetica Neue",Helvetica,Arial,sans-serif;
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    background:var(--cream);
    color:var(--ink);
    font-family:var(--sans);
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  body::before{
    content:"";
    position:fixed;inset:0;
    z-index:0;
    pointer-events:none;
    opacity:.35;
    background-image:
      radial-gradient(rgba(23,21,18,.16) .5px, transparent .7px),
      radial-gradient(rgba(23,21,18,.09) .5px, transparent .7px);
    background-size:4px 4px,7px 7px;
    background-position:0 0,3px 2px;
  }
  ::selection{background:var(--mustard);color:var(--ink)}

  .page{
    position:relative;
    z-index:1;
    min-height:100svh;
    display:flex;
    flex-direction:column;
    max-width:1800px;
    margin:0 auto;
  }

  /* ---------------- masthead ---------------- */
  .masthead{
    display:grid;
    grid-template-columns:minmax(0,1fr) auto;
    gap:22px clamp(24px,4vw,64px);
    align-items:end;
    padding:clamp(18px,2.6vw,32px) clamp(18px,3.6vw,54px) clamp(16px,2.2vw,26px);
    border-bottom:2px solid var(--ink);
    position:relative;
  }
  .masthead::after{
    content:"";
    position:absolute;left:clamp(18px,3.6vw,54px);right:clamp(18px,3.6vw,54px);bottom:-6px;
    height:1px;background:var(--ink);opacity:.5;
  }
  .kicker{
    display:flex;align-items:center;gap:12px;
    font-family:var(--mono);
    font-size:.56rem;
    letter-spacing:.18em;
    text-transform:uppercase;
    margin-bottom:clamp(10px,1.4vw,16px);
  }
  .kicker .dot{
    width:8px;height:8px;background:var(--vermilion);
    border-radius:50%;
    flex:none;
  }
  .kicker .spacer{flex:1;max-width:44px;height:1px;background:var(--ink);opacity:.4}
  .kicker .thin{opacity:.55}

  h1{
    margin:0;
    font-size:clamp(3.1rem,7.4vw,7rem);
    line-height:.8;
    letter-spacing:-.055em;
    font-weight:800;
    text-transform:uppercase;
    display:flex;
    align-items:baseline;
    flex-wrap:wrap;
    gap:0 .13em;
  }
  h1 .run{color:var(--cobalt);position:relative}
  h1 .run::after{
    content:"";
    position:absolute;
    right:-.18em;top:.1em;
    width:.14em;height:.14em;
    border-radius:50%;
    background:var(--vermilion);
  }
  .tagline{
    font-family:var(--serif);
    font-style:italic;
    font-size:clamp(1rem,1.55vw,1.32rem);
    margin:11px 0 0;
    letter-spacing:.005em;
    color:rgba(23,21,18,.78);
  }
  .tagline .by{
    font-family:var(--mono);
    font-style:normal;
    font-size:.52rem;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:rgba(23,21,18,.48);
    margin-left:14px;
    white-space:nowrap;
  }
  .swatches{
    display:flex;gap:6px;margin-top:16px;
  }
  .swatches i{
    width:26px;height:7px;
    display:block;
    border:1px solid var(--ink);
  }
  .swatches i:nth-child(1){background:var(--cobalt)}
  .swatches i:nth-child(2){background:var(--vermilion)}
  .swatches i:nth-child(3){background:var(--mustard)}
  .swatches i:nth-child(4){background:var(--ink)}

  .mast-right{
    display:flex;
    flex-direction:column;
    align-items:flex-end;
    gap:10px;
    min-width:270px;
  }
  .counter{
    display:flex;align-items:flex-end;gap:12px;
    line-height:1;
  }
  .counter .label{
    font-family:var(--mono);
    font-size:.53rem;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:rgba(23,21,18,.55);
    padding-bottom:5px;
    text-align:right;
    max-width:8ch;
    line-height:1.4;
  }
  .counter .num{
    font-family:var(--sans);
    font-weight:800;
    font-size:clamp(2.7rem,4.4vw,4rem);
    letter-spacing:-.06em;
    font-variant-numeric:tabular-nums;
    line-height:.7;
    color:var(--ink);
  }
  .counter .num::after{
    content:"";
    display:inline-block;
    width:9px;height:9px;
    background:var(--mustard);
    border:1px solid var(--ink);
    margin-left:8px;
    vertical-align:baseline;
  }
  .control-row{
    display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end;
  }
  .ctl{
    font-family:var(--mono);
    font-size:.58rem;
    letter-spacing:.11em;
    text-transform:uppercase;
    border:1.5px solid var(--ink);
    background:var(--cream);
    color:var(--ink);
    padding:9px 12px;
    cursor:pointer;
    display:flex;align-items:center;gap:8px;
    box-shadow:2px 2px 0 rgba(23,21,18,.9);
    transition:transform .12s ease,box-shadow .12s ease,background .2s ease;
    white-space:nowrap;
  }
  .ctl:hover{background:var(--mustard)}
  .ctl:active{transform:translate(2px,2px);box-shadow:0 0 0 rgba(23,21,18,.9)}
  .ctl:focus-visible{outline:2px solid var(--cobalt);outline-offset:3px}
  .ctl b{font-weight:700}
  .ctl.speed{background:var(--ink);color:var(--cream)}
  .ctl.speed:hover{background:var(--cobalt)}
  .ctl.speed b{color:var(--mustard)}
  .ctl.release{background:var(--vermilion);color:var(--cream)}
  .ctl.release:hover{background:var(--cobalt)}
  .ctl.reset{background:transparent}
  .ctl.reset:hover{background:var(--cream-deep)}
  .mast-note{
    font-family:var(--mono);
    font-size:.5rem;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:rgba(23,21,18,.44);
    text-align:right;
  }

  /* ---------------- stage ---------------- */
  .stage{
    position:relative;
    flex:1;
    min-height:clamp(380px,45vw,660px);
    overflow:hidden;
    cursor:crosshair;
    isolation:isolate;
    user-select:none;
    -webkit-user-select:none;
    touch-action:manipulation;
  }
  .stage svg{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    display:block;
    overflow:visible;
  }
  .stage::before{
    content:"";
    position:absolute;
    z-index:-1;
    inset:0;
    background:
      radial-gradient(700px 420px at 74% 22%, rgba(230,179,44,.14), transparent 62%),
      radial-gradient(600px 400px at 12% 88%, rgba(37,65,196,.07), transparent 65%);
  }
  .stage-note{
    position:absolute;
    bottom:clamp(12px,1.6vw,20px);
    font-family:var(--mono);
    font-size:.5rem;
    letter-spacing:.13em;
    text-transform:uppercase;
    color:rgba(23,21,18,.48);
    pointer-events:none;
    line-height:1.7;
  }
  .stage-note.left{left:clamp(18px,3.6vw,54px)}
  .stage-note.right{right:clamp(18px,3.6vw,54px);text-align:right}
  .stage-note b{color:var(--ink);font-weight:700}
  .stage-note .hint{
    display:inline-flex;align-items:center;gap:7px;
    color:var(--ink);
  }
  .stage-note .hint::before{
    content:"";
    width:6px;height:6px;border-radius:50%;
    background:var(--vermilion);
    display:inline-block;
    animation:beat 2.6s ease-in-out infinite;
  }
  @keyframes beat{
    0%,100%{transform:scale(1);opacity:.85}
    50%{transform:scale(1.5);opacity:.4}
  }

  .ripple{
    position:absolute;
    width:14px;height:14px;
    margin:-7px 0 0 -7px;
    border-radius:50%;
    border:2px solid var(--vermilion);
    pointer-events:none;
    z-index:4;
    animation:ripple .7s ease-out forwards;
  }
  @keyframes ripple{
    from{transform:scale(.35);opacity:.9}
    to{transform:scale(3.2);opacity:0}
  }

  .marble{transition:opacity .5s ease}
  .marble.done{opacity:0}
  .trail{transition:opacity .5s ease}
  .trail.done{opacity:0}

  /* ---------------- responsive ---------------- */
  @media (max-width:880px){
    .masthead{
      grid-template-columns:1fr;
      align-items:start;
      gap:16px;
      padding-bottom:15px;
    }
    .mast-right{
      width:100%;
      min-width:0;
      flex-direction:row;
      align-items:center;
      justify-content:space-between;
      flex-wrap:wrap;
      gap:12px;
    }
    .counter .num{font-size:2.6rem}
    .counter .label{text-align:left}
    .mast-note{display:none}
    h1{font-size:clamp(3rem,12vw,5.2rem)}
    .tagline .by{display:none}
    .stage{min-height:clamp(330px,58vw,560px)}
  }
  @media (max-width:560px){
    .masthead{padding-top:16px}
    .kicker{font-size:.5rem;letter-spacing:.13em}
    h1{font-size:clamp(2.7rem,14.5vw,4.2rem)}
    .tagline{font-size:1rem;margin-top:9px}
    .swatches i{width:22px;height:6px}
    .mast-right{
      display:grid;
      grid-template-columns:auto 1fr;
      align-items:center;
    }
    .counter .num{font-size:2.3rem}
    .counter .label{font-size:.48rem}
    .control-row{justify-content:flex-end}
    .ctl{padding:8px 9px;font-size:.52rem;gap:5px}
    .stage{min-height:330px}
    .stage-note{font-size:.45rem;letter-spacing:.08em}
    .stage-note.right{display:none}
  }
  @media (prefers-reduced-motion:reduce){
    .stage-note .hint::before{animation:none}
    .ripple{animation-duration:.35s}
    *{scroll-behavior:auto}
    .marble,.trail{transition-duration:.2s}
  }
</style>
</head>
<body>
<div class="page" id="page">

  <header class="masthead">
    <div class="mast-left">
      <div class="kicker">
        <span class="dot" aria-hidden="true"></span>
        Kinetic studies <span class="thin">/ No. 03</span>
        <span class="spacer" aria-hidden="true"></span>
        <span class="thin">Edition 1 / 1</span>
      </div>
      <h1>Marble <span class="run">Run</span></h1>
      <p class="tagline">A study in gravity, taking its time.<span class="by">Gouache &amp; steel, 2026</span></p>
      <div class="swatches" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    </div>

    <div class="mast-right">
      <div class="counter">
        <span class="label">Marbles released</span>
        <span class="num" id="count" aria-live="polite">00</span>
      </div>
      <div class="control-row">
        <button class="ctl speed" id="speed" type="button" aria-label="Toggle speed. Currently 1 times.">
          <span>Speed</span><b id="speedVal">1×</b>
        </button>
        <button class="ctl release" id="release" type="button">+ Release</button>
        <button class="ctl reset" id="reset" type="button">Reset</button>
      </div>
      <div class="mast-note">Click the stage or press space</div>
    </div>
  </header>

  <section class="stage" id="stage" aria-label="Interactive marble run. Click anywhere to release a marble.">
    <svg id="runSvg" viewBox="0 0 1200 760" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="runTitle runDesc">
      <title id="runTitle">Marble Run, an interactive kinetic sculpture</title>
      <desc id="runDesc">A cream poster with a sweeping black marble track: a long opening curve, a tall loop, and a final descent to a catch ring. Clicking releases coloured glass marbles that accelerate along the groove.</desc>
      <defs>
        <radialGradient id="glassCobalt" cx="34%" cy="28%" r="80%">
          <stop offset="0" stop-color="#b9c6ff"/>
          <stop offset=".28" stop-color="#5570ec"/>
          <stop offset=".7" stop-color="#2541c4"/>
          <stop offset="1" stop-color="#0b1560"/>
        </radialGradient>
        <radialGradient id="glassVermilion" cx="34%" cy="28%" r="80%">
          <stop offset="0" stop-color="#ffc3b0"/>
          <stop offset=".28" stop-color="#ff7756"/>
          <stop offset=".7" stop-color="#e94a2b"/>
          <stop offset="1" stop-color="#7d1a0c"/>
        </radialGradient>
        <radialGradient id="glassMustard" cx="34%" cy="28%" r="80%">
          <stop offset="0" stop-color="#fff2bd"/>
          <stop offset=".28" stop-color="#f6d05d"/>
          <stop offset=".7" stop-color="#e6b32c"/>
          <stop offset="1" stop-color="#8a6310"/>
        </radialGradient>
        <radialGradient id="glassInk" cx="34%" cy="28%" r="80%">
          <stop offset="0" stop-color="#9a958a"/>
          <stop offset=".26" stop-color="#504b42"/>
          <stop offset=".7" stop-color="#26231e"/>
          <stop offset="1" stop-color="#080706"/>
        </radialGradient>
        <filter id="trackShadow" x="-10%" y="-20%" width="120%" height="150%">
          <feDropShadow dx="0" dy="10" stdDeviation="7" flood-color="#171512" flood-opacity=".22"/>
        </filter>
        <filter id="marbleShadow" x="-80%" y="-80%" width="260%" height="300%">
          <feDropShadow dx="0" dy="4" stdDeviation="2.4" flood-color="#171512" flood-opacity=".35"/>
        </filter>
        <pattern id="stageDots" width="26" height="26" patternUnits="userSpaceOnUse">
          <circle cx="2" cy="2" r=".9" fill="#171512" opacity=".16"/>
        </pattern>
      </defs>

      <!-- wide poster geometry -->
      <g aria-hidden="true">
        <rect x="0" y="0" width="1200" height="760" fill="url(#stageDots)" opacity=".5"/>
        <circle cx="1072" cy="86" r="196" fill="none" stroke="#e6b32c" stroke-width="30" opacity=".7"/>
        <circle cx="1072" cy="86" r="196" fill="none" stroke="#171512" stroke-width="1.5" opacity=".38"/>
        <path d="M-20 664 C180 596 310 710 520 690 S900 570 1220 640" fill="none" stroke="#2541c4" stroke-width="2" opacity=".26"/>
        <path d="M-20 690 C190 620 320 736 530 714 S910 596 1220 664" fill="none" stroke="#2541c4" stroke-width="1" opacity=".16"/>
        <rect x="24" y="24" width="1152" height="712" fill="none" stroke="#171512" stroke-width="1" opacity=".13"/>
        <text x="1176" y="708" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-weight="800" font-size="172" fill="none" stroke="#171512" stroke-width="1" opacity=".1" letter-spacing="-10">03</text>
        <g transform="translate(1160,640)" opacity=".55">
          <circle r="14" fill="none" stroke="#171512" stroke-width="1"/>
          <path d="M-14 0H14M0 -14V14" stroke="#171512" stroke-width="1"/>
        </g>
      </g>

      <g id="posts" aria-hidden="true"></g>

      <!-- the track -->
      <g filter="url(#trackShadow)">
        <path id="trackPath" d="M 80 140 C 160 140, 195 235, 240 300 C 285 368, 345 415, 410 405 C 458 398, 500 408, 535 418 C 598 424, 648 375, 648 320 C 648 248, 600 204, 540 204 C 480 204, 432 248, 432 320 C 432 378, 480 424, 540 420 C 615 416, 670 440, 720 480 C 780 528, 815 585, 870 620 C 940 662, 1010 682, 1105 700" fill="none" stroke="none"/>
        <path id="grooveOuter" d="M 80 140 C 160 140, 195 235, 240 300 C 285 368, 345 415, 410 405 C 458 398, 500 408, 535 418 C 598 424, 648 375, 648 320 C 648 248, 600 204, 540 204 C 480 204, 432 248, 432 320 C 432 378, 480 424, 540 420 C 615 416, 670 440, 720 480 C 780 528, 815 585, 870 620 C 940 662, 1010 682, 1105 700" fill="none" stroke="#171512" stroke-width="31" stroke-linecap="round" stroke-linejoin="round"/>
        <path id="grooveInner" d="M 80 140 C 160 140, 195 235, 240 300 C 285 368, 345 415, 410 405 C 458 398, 500 408, 535 418 C 598 424, 648 375, 648 320 C 648 248, 600 204, 540 204 C 480 204, 432 248, 432 320 C 432 378, 480 424, 540 420 C 615 416, 670 440, 720 480 C 780 528, 815 585, 870 620 C 940 662, 1010 682, 1105 700" fill="none" stroke="#3a342a" stroke-width="21" stroke-linecap="round" stroke-linejoin="round"/>
        <path id="grooveCenter" d="M 80 140 C 160 140, 195 235, 240 300 C 285 368, 345 415, 410 405 C 458 398, 500 408, 535 418 C 598 424, 648 375, 648 320 C 648 248, 600 204, 540 204 C 480 204, 432 248, 432 320 C 432 378, 480 424, 540 420 C 615 416, 670 440, 720 480 C 780 528, 815 585, 870 620 C 940 662, 1010 682, 1105 700" fill="none" stroke="#f4ecd8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" opacity=".92"/>
      </g>

      <!-- start hopper -->
      <g id="startGear" aria-hidden="true">
        <ellipse cx="80" cy="146" rx="41" ry="32" fill="#e94a2b" opacity=".12"/>
        <path d="M57 79 H103 L94 130 H66 Z" fill="#e94a2b" stroke="#171512" stroke-width="2.4"/>
        <path d="M57 79 H103" stroke="#171512" stroke-width="5"/>
        <path d="M68 93 H92" stroke="#f4ecd8" stroke-width="1.4" opacity=".8"/>
        <text x="49" y="65" font-family="SFMono-Regular, Menlo, monospace" font-size="9" letter-spacing="2" fill="#171512">RELEASE</text>
        <line x1="49" y1="69" x2="72" y2="79" stroke="#171512" stroke-width="1"/>
        <circle cx="80" cy="141" r="15" fill="none" stroke="#171512" stroke-width="1" opacity=".5" stroke-dasharray="2 4"/>
      </g>

      <!-- finish catch -->
      <g id="finishGear" aria-hidden="true">
        <circle cx="1108" cy="694" r="35" fill="none" stroke="#171512" stroke-width="2"/>
        <circle cx="1108" cy="694" r="26" fill="#e6b32c" stroke="#171512" stroke-width="2"/>
        <circle cx="1108" cy="694" r="9" fill="none" stroke="#171512" stroke-width="1.5"/>
        <text x="1108" y="736" text-anchor="middle" font-family="SFMono-Regular, Menlo, monospace" font-size="9" letter-spacing="2.2" fill="#171512">CATCH</text>
        <line x1="1108" y1="722" x2="1108" y2="726" stroke="#171512" stroke-width="1"/>
      </g>

      <g id="trails" aria-hidden="true"></g>
      <g id="marbles"></g>
    </svg>

    <div class="stage-note left">
      <span class="hint">Click anywhere to release</span><br>
      Fig. 1 — one track, four colours, no two runs alike
    </div>
    <div class="stage-note right">
      <b id="running">0</b> in motion<br>
      Brass / glass / linseed ink
    </div>
  </section>
</div>

<script>
(function () {
  "use strict";

  var svgNS = "http://www.w3.org/2000/svg";
  var path = document.getElementById("trackPath");
  var marblesLayer = document.getElementById("marbles");
  var trailsLayer = document.getElementById("trails");
  var stage = document.getElementById("stage");
  var page = document.getElementById("page");
  var countEl = document.getElementById("count");
  var runningEl = document.getElementById("running");
  var speedBtn = document.getElementById("speed");
  var speedVal = document.getElementById("speedVal");
  var releaseBtn = document.getElementById("release");
  var resetBtn = document.getElementById("reset");

  var COLORS = [
    { key: "cobalt", grad: "glassCobalt", base: "#2541c4" },
    { key: "vermilion", grad: "glassVermilion", base: "#e94a2b" },
    { key: "mustard", grad: "glassMustard", base: "#e6b32c" },
    { key: "ink", grad: "glassInk", base: "#171512" }
  ];

  var GRAVITY = 1000;
  var DRAG = 0.08;
  var STEP = 1 / 120;
  var MAX_MARBLES = 48;

  var totalLength = path.getTotalLength();
  var SAMPLE_STEP = 2.5;
  var samples = [];
  var sampleCount = Math.ceil(totalLength / SAMPLE_STEP);

  for (var i = 0; i <= sampleCount; i++) {
    var sp = path.getPointAtLength(Math.min(totalLength, i * SAMPLE_STEP));
    samples.push({ x: sp.x, y: sp.y });
  }

  var marbles = [];
  var released = 0;
  var speed = 1;
  var lastTime = performance.now();
  var accumulator = 0;

  function pointAt(s) {
    if (s <= 0) return samples[0];
    if (s >= totalLength) return samples[samples.length - 1];
    var idx = s / SAMPLE_STEP;
    var lo = Math.floor(idx);
    var hi = Math.min(samples.length - 1, lo + 1);
    var f = idx - lo;
    var a = samples[lo];
    var b = samples[hi];
    return {
      x: a.x + (b.x - a.x) * f,
      y: a.y + (b.y - a.y) * f
    };
  }

  function el(tag, attrs) {
    var node = document.createElementNS(svgNS, tag);
    if (attrs) {
      Object.keys(attrs).forEach(function (k) {
        node.setAttribute(k, attrs[k]);
      });
    }
    return node;
  }

  /* Supports generated from the real path so the structure agrees with the drawing. */
  var posts = document.getElementById("posts");
  var postS = 150;
  var lastPostX = -999;
  while (postS < totalLength - 60) {
    var pp = pointAt(postS);
    if (pp.x - lastPostX > 72) {
      var baseX = pp.x + (pp.x < 600 ? -10 : 10);
      posts.appendChild(el("line", {
        x1: pp.x.toFixed(1), y1: pp.y.toFixed(1),
        x2: baseX.toFixed(1), y2: "738",
        stroke: "#171512", "stroke-width": "1.1", opacity: ".55"
      }));
      posts.appendChild(el("ellipse", {
        cx: baseX.toFixed(1), cy: "739.5", rx: "7", ry: "2.4",
        fill: "#171512", opacity: ".4"
      }));
      posts.appendChild(el("circle", {
        cx: pp.x.toFixed(1), cy: pp.y.toFixed(1), r: "3.1",
        fill: "#f4ecd8", stroke: "#171512", "stroke-width": "1.1"
      }));
      lastPostX = pp.x;
    }
    postS += 96;
  }
  // Ground shadow line
  posts.appendChild(el("line", {
    x1: "34", y1: "742", x2: "1166", y2: "742",
    stroke: "#171512", "stroke-width": "1", opacity: ".15"
  }));

  function updateCount() {
    countEl.textContent = String(released).padStart(2, "0");
  }

  function updateRunning() {
    runningEl.textContent = String(marbles.filter(function (m) { return !m.done; }).length);
  }

  function createMarble(color) {
    var r = 13.5 + (released % 3) * 1.2;
    var g = el("g", { "class": "marble" });

    var shadow = el("ellipse", {
      cx: "1", cy: String(r * 0.85), rx: String(r * 0.92), ry: String(r * 0.4),
      fill: "#171512", opacity: ".28"
    });
    g.appendChild(shadow);

    var ball = el("circle", {
      r: String(r), fill: "url(#" + color.grad + ")",
      stroke: "#171512", "stroke-width": "1.2",
      filter: "url(#marbleShadow)"
    });
    g.appendChild(ball);

    g.appendChild(el("circle", {
      r: String(r - 3.2), fill: "none", stroke: "#ffffff",
      "stroke-width": ".9", opacity: ".22"
    }));

    var glint = el("ellipse", {
      cx: String(-r * 0.33), cy: String(-r * 0.4),
      rx: String(r * 0.32), ry: String(r * 0.19),
      fill: "#ffffff", opacity: ".8",
      transform: "rotate(-28)"
    });
    g.appendChild(glint);

    g.appendChild(el("circle", {
      cx: String(r * 0.28), cy: String(r * 0.36), r: String(r * 0.15),
      fill: "#ffffff", opacity: ".2"
    }));

    // Thin meridian line to read as glass rather than paint.
    g.appendChild(el("path", {
      d: "M" + (-r * 0.55) + " " + (r * 0.58) + " Q 0 " + (r * 1.15) + " " + (r * 0.55) + " " + (r * 0.58),
      fill: "none", stroke: "#ffffff", "stroke-width": ".7", opacity: ".22"
    }));

    return { node: g, r: r };
  }

  function releaseMarble() {
    if (marbles.length >= MAX_MARBLES) {
      // Retire the oldest marble so the sculpture never chokes.
      var oldest = marbles.shift();
      removeMarble(oldest, true);
    }

    var color = COLORS[released % COLORS.length];
    var built = createMarble(color);
    var trail = el("path", {
      "class": "trail", fill: "none",
      stroke: color.key === "ink" ? "#f4ecd8" : color.base,
      "stroke-width": "3.1", "stroke-linecap": "round",
      "stroke-linejoin": "round", opacity: ".32"
    });

    var m = {
      s: 0,
      v: 30,
      color: color,
      r: built.r,
      node: built.node,
      trail: trail,
      trailPts: [],
      pos: pointAt(0),
      lastTrail: null,
      done: false
    };

    marblesLayer.appendChild(built.node);
    trailsLayer.appendChild(trail);
    marbles.push(m);

    released += 1;
    updateCount();
    updateRunning();

    // A little launch pulse at the hopper.
    var pulse = el("circle", {
      cx: "80", cy: "141", r: "15", fill: "none",
      stroke: color.base, "stroke-width": "2", opacity: ".7"
    });
    marblesLayer.insertBefore(pulse, marblesLayer.firstChild);
    var grow = 0;
    function pulseStep() {
      grow += 0.06;
      pulse.setAttribute("r", String(15 + grow * 34));
      pulse.setAttribute("opacity", String(Math.max(0, 0.7 - grow)));
      if (grow < 1) {
        requestAnimationFrame(pulseStep);
      } else if (pulse.parentNode) {
        pulse.parentNode.removeChild(pulse);
      }
    }
    requestAnimationFrame(pulseStep);

    return m;
  }

  function removeMarble(m, immediate) {
    if (!m) return;
    if (!m.done) {
      m.done = true;
      m.node.classList.add("done");
      m.trail.classList.add("done");
      updateRunning();
    }
    var node = m.node;
    var trail = m.trail;
    setTimeout(function () {
      if (node.parentNode) node.parentNode.removeChild(node);
      if (trail.parentNode) trail.parentNode.removeChild(trail);
    }, immediate ? 0 : 560);
  }

  function physicsStep(dt) {
    for (var i = 0; i < marbles.length; i++) {
      var m = marbles[i];
      if (m.done) continue;

      var p1 = pointAt(m.s);
      var p2 = pointAt(Math.min(totalLength, m.s + 2));
      var grade = (p2.y - p1.y) / 2;
      var accel = GRAVITY * grade - DRAG * m.v;

      m.v += accel * dt;
      if (m.v < 8) m.v = 8;
      if (m.v > 1150) m.v = 1150;

      m.s += m.v * dt;
      if (m.s >= totalLength) {
        m.s = totalLength;
        m.pos = pointAt(totalLength);
        finishMarble(m);
      } else {
        m.pos = pointAt(m.s);
      }
    }
  }

  function finishMarble(m) {
    if (m.done) return;
    m.done = true;
    m.node.classList.add("done");
    m.trail.classList.add("done");
    updateRunning();
    var node = m.node;
    var trail = m.trail;
    setTimeout(function () {
      if (node.parentNode) node.parentNode.removeChild(node);
      if (trail.parentNode) trail.parentNode.removeChild(trail);
    }, 560);
  }

  function drawMarble(m) {
    if (!m.pos) return;
    m.node.setAttribute("transform",
      "translate(" + m.pos.x.toFixed(2) + " " + m.pos.y.toFixed(2) + ")");

    if (m.done) return;
    var last = m.lastTrail;
    if (!last || Math.hypot(m.pos.x - last.x, m.pos.y - last.y) > 7) {
      m.trailPts.push({ x: m.pos.x, y: m.pos.y });
      if (m.trailPts.length > 72) m.trailPts.shift();
      m.lastTrail = { x: m.pos.x, y: m.pos.y };

      var d = "";
      for (var i = 0; i < m.trailPts.length; i++) {
        d += (i === 0 ? "M" : "L") + m.trailPts[i].x.toFixed(1) + " " + m.trailPts[i].y.toFixed(1) + " ";
      }
      m.trail.setAttribute("d", d);
    }
  }

  function frame(now) {
    var dt = (now - lastTime) / 1000;
    lastTime = now;
    if (dt > 0.08) dt = 0.08;
    dt *= speed;
    accumulator += dt;

    var guard = 0;
    while (accumulator >= STEP && guard < 14) {
      physicsStep(STEP);
      accumulator -= STEP;
      guard++;
    }

    for (var i = 0; i < marbles.length; i++) {
      drawMarble(marbles[i]);
    }

    requestAnimationFrame(frame);
  }

  function ripple(x, y, color) {
    var stageRect = stage.getBoundingClientRect();
    var dot = document.createElement("div");
    dot.className = "ripple";
    dot.style.left = (x - stageRect.left) + "px";
    dot.style.top = (y - stageRect.top) + "px";
    dot.style.borderColor = color;
    stage.appendChild(dot);
    dot.addEventListener("animationend", function () {
      if (dot.parentNode) dot.parentNode.removeChild(dot);
    });
    setTimeout(function () {
      if (dot.parentNode) dot.parentNode.removeChild(dot);
    }, 900);
  }

  function isControl(target) {
    return !!(target && target.closest &&
      target.closest("button, a, input, select, textarea, .ctl"));
  }

  page.addEventListener("click", function (e) {
    if (isControl(e.target)) return;
    var color = COLORS[released % COLORS.length];
    releaseMarble();
    // Only draw a ripple inside the stage.
    if (stage.contains(e.target)) {
      ripple(e.clientX, e.clientY, color.base);
    }
  });

  releaseBtn.addEventListener("click", function (e) {
    e.stopPropagation();
    releaseMarble();
  });

  resetBtn.addEventListener("click", function (e) {
    e.stopPropagation();
    for (var i = 0; i < marbles.length; i++) {
      removeMarble(marbles[i], true);
    }
    marbles = [];
    released = 0;
    speed = 1;
    speedVal.textContent = "1×";
    speedBtn.setAttribute("aria-label", "Toggle speed. Currently 1 times.");
    updateCount();
    updateRunning();
    accumulator = 0;
    lastTime = performance.now();
  });

  speedBtn.addEventListener("click", function (e) {
    e.stopPropagation();
    speed = speed === 1 ? 2 : 1;
    speedVal.textContent = speed + "×";
    speedBtn.setAttribute("aria-label", "Toggle speed. Currently " + speed + " times.");
    speedBtn.classList.toggle("is-fast", speed === 2);
    accumulator = 0;
    lastTime = performance.now();
  });

  document.addEventListener("keydown", function (e) {
    if (e.code !== "Space" && e.key !== " ") return;
    if (isControl(e.target) || e.target.isContentEditable) return;
    e.preventDefault();
    releaseMarble();
  });

  // Seed the scene with one marble in motion for an authored first impression.
  setTimeout(function () {
    releaseMarble();
  }, 700);

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
