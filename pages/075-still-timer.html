<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Still — A room to breathe</title>
<style>
  :root{
    --night:#070b14;
    --night-2:#0b1120;
    --mist:#dfeafa;
    --dim:#8696ae;
    --faint:#55637a;
    --line:rgba(190,214,240,.14);
    --line-soft:rgba(190,214,240,.08);
    --aqua:#a9d9d2;
    --rose:#d7b3c1;
    --sans:"Helvetica Neue",Helvetica,Arial,sans-serif;
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    --mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
  button:focus-visible{outline:1px solid rgba(198,228,235,.75);outline-offset:4px}
  body{
    min-height:100svh;
    background:
      radial-gradient(58% 52% at 50% 40%, #15223a 0%, #0b1322 48%, #070b13 78%, #05080e 100%);
    color:var(--mist);
    font-family:var(--sans);
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
    position:relative;
  }
  body::before{
    content:"";position:fixed;inset:-20%;z-index:0;pointer-events:none;
    background:
      radial-gradient(34% 30% at 22% 76%, rgba(64,132,128,.20), rgba(64,132,128,0) 68%),
      radial-gradient(30% 28% at 80% 24%, rgba(104,84,142,.17), rgba(104,84,142,0) 70%),
      radial-gradient(42% 38% at 58% 96%, rgba(38,84,110,.16), rgba(38,84,110,0) 72%);
    filter:blur(26px);
    animation:drift 26s ease-in-out infinite alternate;
  }
  body::after{
    content:"";position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.03;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='180' height='180' filter='url(%23n)' opacity='0.6'/></svg>");
  }
  @keyframes drift{
    0%{transform:translate3d(-1.5%,1%,0) scale(1)}
    100%{transform:translate3d(1.5%,-1.5%,0) scale(1.04)}
  }

  .shell{
    position:relative;z-index:2;
    min-height:100svh;display:flex;flex-direction:column;
    padding:0 clamp(20px,4vw,48px);
  }

  /* ── top bar ────────────────────────────────────────────── */
  .topbar{
    display:flex;align-items:center;justify-content:space-between;gap:18px;
    padding:22px 0 0;
  }
  .wordmark{
    font-family:var(--mono);font-size:11px;letter-spacing:.52em;text-transform:uppercase;
    color:rgba(223,234,250,.86);
  }
  .top-note{
    font-family:var(--mono);font-size:8px;letter-spacing:.24em;text-transform:uppercase;
    color:var(--faint);text-align:right;line-height:1.7;
  }
  .top-note b{font-weight:400;color:var(--dim)}

  /* ── main ───────────────────────────────────────────────── */
  main{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:clamp(14px,2.4vh,28px) 0 clamp(10px,2vh,24px);min-height:0;
  }
  .intro{text-align:center;margin-bottom:clamp(14px,2.6vh,28px)}
  h1{
    font-family:var(--serif);font-weight:400;font-style:italic;
    font-size:clamp(28px,3.3vw,42px);letter-spacing:-.015em;
    margin:0;color:#eef4fb;line-height:1.1;
  }
  .intro .cap{
    margin:9px 0 0;font-family:var(--mono);font-size:8px;letter-spacing:.32em;
    text-transform:uppercase;color:var(--faint);
  }

  /* ── practice circle ────────────────────────────────────── */
  .practice{
    position:relative;
    width:clamp(248px, min(56vh, 74vw), 456px);
    aspect-ratio:1/1;
    flex:none;
    display:grid;place-items:center;
  }
  .aura{
    position:absolute;inset:2%;border-radius:50%;
    background:
      radial-gradient(circle at 50% 42%, rgba(148,206,202,.13), rgba(148,206,202,.04) 52%, rgba(148,206,202,0) 70%),
      radial-gradient(circle at 62% 68%, rgba(197,150,170,.09), rgba(197,150,170,0) 60%);
    filter:blur(6px);
    pointer-events:none;
  }

  .progress{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
  .progress .track{fill:none;stroke:rgba(196,220,244,.13);stroke-width:1}
  .progress .ticks{fill:none;stroke:rgba(196,220,244,.12);stroke-width:1;stroke-dasharray:.6 18.7}
  .progress .arc{
    fill:none;stroke:rgba(205,232,238,.62);stroke-width:1.4;stroke-linecap:round;
    transition:stroke .6s ease;
  }
  .progress .cap-dot{fill:rgba(224,242,245,.85)}

  .breath{
    position:absolute;inset:6%;border-radius:50%;
    display:grid;place-items:center;
    transform:scale(.8);
    will-change:transform;
  }
  .breath::before{
    content:"";position:absolute;inset:19%;border-radius:50%;
    background:radial-gradient(circle at 50% 44%, rgba(170,214,216,.11), rgba(150,196,204,.04) 62%, rgba(150,196,204,0) 74%);
    filter:blur(4px);
  }
  .ring{
    position:absolute;border-radius:50%;border:1px solid rgba(206,228,246,.12);
  }
  .ring.r1{inset:0;border-color:rgba(206,228,246,.20);box-shadow:0 0 42px rgba(130,190,200,.07) inset,0 0 52px rgba(130,190,200,.05)}
  .ring.r2{inset:9%;border-color:rgba(206,228,246,.13)}
  .ring.r3{inset:18%;border-color:rgba(206,228,246,.16);border-style:dashed;animation:slow 90s linear infinite}
  .ring.r4{inset:27%;border-color:rgba(206,228,246,.10);background:radial-gradient(circle,rgba(171,210,214,.055),rgba(171,210,214,0) 68%)}
  .ring.r5{inset:36%;border-color:rgba(206,228,246,.17);box-shadow:0 0 34px rgba(154,202,208,.09)}
  @keyframes slow{to{transform:rotate(360deg)}}

  .core{
    position:relative;z-index:3;text-align:center;display:flex;flex-direction:column;align-items:center;
    padding:0 10%;
  }
  .phase{
    font-family:var(--mono);font-size:clamp(8px, .9vw, 9.5px);
    letter-spacing:.34em;text-transform:uppercase;color:rgba(207,229,241,.72);
    margin-bottom:clamp(8px,1.2vh,14px);
    transition:color .5s ease;
    min-height:1.4em;
    display:flex;align-items:center;gap:9px;
  }
  .phase::before{
    content:"";width:4px;height:4px;border-radius:50%;
    background:rgba(169,217,210,.75);box-shadow:0 0 8px rgba(169,217,210,.5);
    flex:none;
  }
  .count{
    font-family:var(--sans);font-weight:200;
    font-size:clamp(42px,4.8vw,58px);
    line-height:1;letter-spacing:.045em;
    color:#f2f7fc;
    font-variant-numeric:tabular-nums;
    text-shadow:0 0 34px rgba(160,200,210,.12);
  }
  .count-sub{
    margin-top:clamp(7px,1vh,10px);
    font-family:var(--mono);font-size:7.5px;letter-spacing:.3em;text-transform:uppercase;
    color:rgba(150,168,190,.62);
    transition:opacity .6s ease;
  }
  .practice.complete .count-sub{opacity:0}
  .complete-note{
    margin-top:8px;font-family:var(--serif);font-style:italic;font-size:12.5px;
    color:rgba(206,228,238,.7);opacity:0;transition:opacity .8s ease;
  }
  .practice.complete .complete-note{opacity:1}
  .practice.complete .aura{animation:bloom 2.8s ease-out both}
  @keyframes bloom{
    0%{filter:blur(6px);opacity:1}
    35%{filter:blur(10px);opacity:1}
    100%{filter:blur(16px);opacity:.7}
  }
  .practice.complete .ring.r1{border-color:rgba(215,240,232,.35)}

  /* ── controls ───────────────────────────────────────────── */
  .controls{display:flex;flex-direction:column;align-items:center;gap:clamp(12px,1.8vh,18px);margin-top:clamp(16px,2.6vh,28px)}
  .presets{
    display:flex;align-items:stretch;gap:2px;padding:2px;
    border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.012);
  }
  .preset{
    min-width:64px;padding:8px 14px 7px;border-radius:999px;
    background:transparent;
    font-family:var(--mono);font-size:9px;letter-spacing:.13em;text-transform:uppercase;
    color:var(--dim);transition:background .25s ease,color .25s ease;cursor:pointer;
  }
  .preset span{font-size:8px;letter-spacing:.05em;color:var(--faint);margin-left:2px}
  .preset:hover{color:var(--mist)}
  .preset.active{background:rgba(198,224,232,.13);color:#eef6fa}
  .preset.active span{color:rgba(214,235,241,.6)}

  .transport{display:flex;align-items:center;gap:14px}
  .start{
    height:50px;min-width:154px;padding:0 26px;border-radius:999px;
    border:1px solid rgba(196,225,231,.34);
    background:rgba(196,225,231,.055);
    color:#e8f3f7;
    font-family:var(--mono);font-size:9.5px;letter-spacing:.24em;text-transform:uppercase;
    display:flex;align-items:center;justify-content:center;gap:10px;
    cursor:pointer;
    transition:background .3s ease,border-color .3s ease,box-shadow .3s ease,transform .2s ease;
  }
  .start svg{width:11px;height:11px;flex:none;opacity:.9}
  .start:hover{background:rgba(196,225,231,.11);border-color:rgba(196,225,231,.6);box-shadow:0 0 30px rgba(150,200,210,.12)}
  .start:active{transform:translateY(1px)}
  .start .icon-pause{display:none}
  .start.running .icon-play{display:none}
  .start.running .icon-pause{display:block}
  .reset{
    width:50px;height:50px;border-radius:50%;
    border:1px solid rgba(196,225,231,.14);
    background:transparent;
    display:grid;place-items:center;cursor:pointer;color:var(--dim);
    transition:color .25s ease,border-color .25s ease,transform .4s ease,background .25s ease;
  }
  .reset svg{width:14px;height:14px}
  .reset:hover{color:var(--mist);border-color:rgba(196,225,231,.4);transform:rotate(-28deg);background:rgba(196,225,231,.05)}
  .session{
    display:flex;align-items:center;gap:8px;
    font-family:var(--mono);font-size:7.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--faint);
  }
  .session b{font-weight:400;color:var(--dim);font-variant-numeric:tabular-nums;letter-spacing:.1em}
  .session i{width:14px;height:1px;background:var(--line);display:block}

  /* ── footer ─────────────────────────────────────────────── */
  footer{
    display:flex;align-items:center;justify-content:space-between;gap:18px;
    border-top:1px solid var(--line-soft);
    padding:16px 0 20px;
    font-family:var(--mono);font-size:7.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--faint);
  }
  footer .quiet{font-family:var(--serif);font-style:italic;font-size:12px;letter-spacing:.01em;text-transform:none;color:rgba(172,190,208,.72)}
  footer span:last-child{text-align:right}

  @media (max-height:760px) and (min-width:700px){
    .intro{margin-bottom:12px}
    h1{font-size:30px}
    .intro .cap{margin-top:6px}
    .controls{gap:12px;margin-top:14px}
    .practice{width:min(48vh, 440px)}
    footer{padding:12px 0 16px}
  }
  @media (max-width:600px){
    .shell{padding:0 18px}
    .topbar{padding-top:18px}
    .wordmark{font-size:10px;letter-spacing:.44em}
    .top-note{font-size:7px;letter-spacing:.16em}
    main{padding:16px 0 8px}
    h1{font-size:clamp(27px,7.6vw,34px)}
    .intro{margin-bottom:18px}
    .practice{width:min(76vw, 340px)}
    .count{font-size:46px}
    .controls{margin-top:20px;gap:14px}
    .preset{min-width:58px;padding:8px 11px 7px}
    .start{min-width:140px;height:48px;padding:0 20px}
    .reset{width:48px;height:48px}
    footer{flex-direction:column;gap:7px;text-align:center;padding:14px 0 18px}
    footer span:last-child{display:none}
  }
  @media (prefers-reduced-motion:reduce){
    body::before{animation:none}
    .ring.r3{animation:none}
    .practice.complete .aura{animation:none}
    *{transition-duration:.001ms !important}
  }
</style>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <div class="wordmark">Still</div>
    <div class="top-note"><b>A quiet practice</b> · no. 05<br>Meditation timer</div>
  </header>

  <main>
    <div class="intro">
      <h1>A room to breathe.</h1>
      <p class="cap">Sixteen-second breath · four-second tide</p>
    </div>

    <section class="practice" id="practice" aria-label="Breathing timer">
      <div class="aura" aria-hidden="true"></div>

      <svg class="progress" viewBox="0 0 400 400" aria-hidden="true">
        <circle class="ticks" cx="200" cy="200" r="184"></circle>
        <circle class="track" cx="200" cy="200" r="196"></circle>
        <circle class="arc" id="arc" cx="200" cy="200" r="196" transform="rotate(-90 200 200)"></circle>
        <circle class="cap-dot" id="capdot" cx="200" cy="4" r="2.4"></circle>
      </svg>

      <div class="breath" id="breath" aria-hidden="true">
        <span class="ring r1"></span>
        <span class="ring r2"></span>
        <span class="ring r3"></span>
        <span class="ring r4"></span>
        <span class="ring r5"></span>
      </div>

      <div class="core">
        <div class="phase" id="phase" aria-live="polite">Breathe in</div>
        <div class="count" id="count">03:00</div>
        <div class="count-sub">remaining</div>
        <div class="complete-note">Session complete — stay a moment longer.</div>
      </div>
    </section>

    <div class="controls">
      <div class="presets" role="group" aria-label="Session duration">
        <button class="preset" data-min="1" aria-pressed="false">1<span>min</span></button>
        <button class="preset active" data-min="3" aria-pressed="true">3<span>min</span></button>
        <button class="preset" data-min="5" aria-pressed="false">5<span>min</span></button>
      </div>

      <div class="transport">
        <button class="start" id="start" aria-label="Start meditation session">
          <svg class="icon-play" viewBox="0 0 12 12" fill="none" aria-hidden="true"><path d="M2.6 1.4 10.2 6l-7.6 4.6V1.4Z" fill="currentColor"/></svg>
          <svg class="icon-pause" viewBox="0 0 12 12" fill="none" aria-hidden="true"><path d="M3 1.8v8.4M9 1.8v8.4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          <span id="start-label">Begin</span>
        </button>
        <button class="reset" id="reset" aria-label="Reset timer">
          <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9M13.5 1.8v3.6H9.9" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>

      <div class="session"><i></i> Sessions completed <b id="sessions">00</b></div>
    </div>
  </main>

  <footer>
    <span class="quiet">Sit comfortably. Let the breath find its own pace.</span>
    <span>Headphones optional · a quiet chime at the end</span>
  </footer>
</div>

<script>
(function(){
  "use strict";

  var DURATIONS = { 1: 60, 3: 180, 5: 300 };
  var CYCLE = 16;             // 4s in · 4s hold · 4s out · 4s hold
  var CIRC = 2 * Math.PI * 196;

  var state = {
    duration: 180,
    remaining: 180,
    running: false,
    breath: 0,                // seconds inside the 16s breath cycle
    sessions: 0,
    complete: false
  };

  var practice = document.getElementById("practice");
  var breathEl = document.getElementById("breath");
  var phaseEl = document.getElementById("phase");
  var countEl = document.getElementById("count");
  var arcEl = document.getElementById("arc");
  var capDot = document.getElementById("capdot");
  var startBtn = document.getElementById("start");
  var startLabel = document.getElementById("start-label");
  var resetBtn = document.getElementById("reset");
  var sessionsEl = document.getElementById("sessions");
  var presets = Array.prototype.slice.call(document.querySelectorAll(".preset"));

  var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  arcEl.style.strokeDasharray = CIRC.toFixed(2) + " " + CIRC.toFixed(2);
  arcEl.style.strokeDashoffset = "0";

  function fmt(sec){
    sec = Math.max(0, Math.ceil(sec));
    var m = Math.floor(sec / 60);
    var s = sec % 60;
    return String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
  }

  function ease(t){
    t = Math.max(0, Math.min(1, t));
    return 0.5 - 0.5 * Math.cos(Math.PI * t);
  }

  function phaseAt(bt){
    var t = bt % CYCLE;
    if (t < 4) return { name: "Breathe in", k: ease(t / 4), dir: 1 };
    if (t < 8) return { name: "Hold", k: 1, dir: 0 };
    if (t < 12) return { name: "Breathe out", k: 1 - ease((t - 8) / 4), dir: -1 };
    return { name: "Hold", k: 0, dir: 0 };
  }

  function paintBreath(){
    var p = phaseAt(state.breath);
    var scale = 0.80 + 0.20 * p.k;
    if (!reduceMotion){
      breathEl.style.transform = "scale(" + scale.toFixed(4) + ")";
    } else {
      breathEl.style.transform = "scale(.9)";
    }
    if (!state.complete){
      if (phaseEl.textContent !== p.name) phaseEl.textContent = p.name;
    }
  }

  function paintTime(){
    var text = fmt(state.remaining);
    if (countEl.textContent !== text) countEl.textContent = text;
    var frac = state.duration > 0 ? state.remaining / state.duration : 0;
    var offset = CIRC * (1 - frac);
    arcEl.style.strokeDashoffset = offset.toFixed(2);
    var angle = frac * Math.PI * 2;
    capDot.setAttribute("cx", (200 + Math.cos(angle - Math.PI / 2) * 196).toFixed(2));
    capDot.setAttribute("cy", (200 + Math.sin(angle - Math.PI / 2) * 196).toFixed(2));
    capDot.setAttribute("opacity", frac > 0.002 ? "1" : "0");
  }

  function paintButton(){
    var label = state.running ? "Pause" : (state.complete ? "Begin again" : (state.remaining < state.duration - 0.5 && state.remaining > 0.2 ? "Resume" : "Begin"));
    startLabel.textContent = label;
    startBtn.classList.toggle("running", state.running);
    startBtn.setAttribute("aria-label", state.running ? "Pause meditation session" : (label === "Resume" ? "Resume meditation session" : "Start meditation session"));
  }

  function paintAll(){
    paintBreath();
    paintTime();
    paintButton();
    practice.classList.toggle("complete", state.complete);
    sessionsEl.textContent = String(state.sessions).padStart(2, "0");
  }

  /* ── audio ──────────────────────────────────────────────── */
  var audio = null;
  function ensureAudio(){
    if (!audio){
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      try { audio = new AC(); } catch (e) { audio = null; }
    }
    if (audio && audio.state === "suspended") audio.resume();
  }
  function chime(){
    if (!audio) return;
    var now = audio.currentTime;
    var notes = [
      { f: 523.25, at: 0,    len: 2.9, gain: 0.075 },
      { f: 783.99, at: 0.48, len: 2.4, gain: 0.045 },
      { f: 523.25, at: 1.55, len: 3.4, gain: 0.030 }
    ];
    notes.forEach(function(n){
      var osc = audio.createOscillator();
      var g = audio.createGain();
      osc.type = "sine";
      osc.frequency.value = n.f;
      g.gain.setValueAtTime(0.0001, now + n.at);
      g.gain.linearRampToValueAtTime(n.gain, now + n.at + 0.06);
      g.gain.exponentialRampToValueAtTime(0.0001, now + n.at + n.len);
      osc.connect(g);
      g.connect(audio.destination);
      osc.start(now + n.at);
      osc.stop(now + n.at + n.len + 0.05);
    });
  }

  /* ── timer loop ─────────────────────────────────────────── */
  var raf = 0;
  var last = 0;

  function tick(now){
    if (!state.running){ raf = 0; return; }
    var dt = Math.min((now - last) / 1000, 0.12);
    last = now;
    state.remaining -= dt;
    state.breath += dt;

    if (state.remaining <= 0){
      state.remaining = 0;
      finish();
      return;
    }
    paintBreath();
    paintTime();
    raf = requestAnimationFrame(tick);
  }

  function startLoop(){
    if (!raf){
      last = performance.now();
      raf = requestAnimationFrame(tick);
    }
  }
  function stopLoop(){
    if (raf) cancelAnimationFrame(raf);
    raf = 0;
  }

  function finish(){
    stopLoop();
    state.running = false;
    state.remaining = 0;
    state.breath = 0;
    state.complete = true;
    state.sessions += 1;
    phaseEl.textContent = "Complete";
    paintBreath();
    paintTime();
    paintButton();
    practice.classList.add("complete");
    sessionsEl.textContent = String(state.sessions).padStart(2, "0");
    chime();
  }

  function begin(){
    state.running = true;
    state.complete = false;
    practice.classList.remove("complete");
    startLoop();
    paintButton();
  }

  startBtn.addEventListener("click", function(){
    ensureAudio();
    if (state.running){
      state.running = false;
      stopLoop();
      paintButton();
      return;
    }
    if (state.complete || state.remaining <= 0){
      state.remaining = state.duration;
      state.breath = 0;
      state.complete = false;
      practice.classList.remove("complete");
      phaseEl.textContent = phaseAt(0).name;
      paintTime();
      begin();
      return;
    }
    begin();
  });

  function reset(){
    stopLoop();
    state.running = false;
    state.complete = false;
    state.remaining = state.duration;
    state.breath = 0;
    practice.classList.remove("complete");
    phaseEl.textContent = "Breathe in";
    paintAll();
  }
  resetBtn.addEventListener("click", reset);

  presets.forEach(function(btn){
    btn.addEventListener("click", function(){
      var mins = parseInt(btn.getAttribute("data-min"), 10);
      if (!DURATIONS[mins]) return;
      presets.forEach(function(b){
        var on = b === btn;
        b.classList.toggle("active", on);
        b.setAttribute("aria-pressed", on ? "true" : "false");
      });
      state.duration = DURATIONS[mins];
      reset();
      paintTime();
    });
  });

  // Keep the arc crisp on resize (SVG scales, geometry is viewBox-based).
  window.addEventListener("resize", function(){ paintTime(); });

  // Pause the loop when the page is hidden; treat paused time as unfelt.
  document.addEventListener("visibilitychange", function(){
    if (document.hidden && state.running){
      state.running = false;
      stopLoop();
      paintButton();
    } else if (!document.hidden){
      last = performance.now();
    }
  });

  paintAll();
  paintTime();
})();
</script>
</body>
</html>
