<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dune Study 03 — Atacama</title>
<style>
  :root{
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
    --mono:ui-monospace,"SF Mono","SFMono-Regular",Menlo,Consolas,monospace;
    --sans:"Helvetica Neue",Helvetica,Arial,sans-serif;
  }
  body{
    --d1:#94714b;
    --d2:#ab8a62;
    --d3:#bfa27d;
    --d4:#cdb492;
    --d5:#d7c4a8;
    --rim:rgba(255,249,235,.7);
    --text:#2d281f;
    --muted:rgba(45,40,31,.62);
    --caption:rgba(45,40,31,.74);
    --line:rgba(45,40,31,.24);
    --haze:rgba(255,249,235,.55);
    --scrim:rgba(70,54,32,0);
    --shimmer:.42;
  }
  body[data-hour="dusk"]{
    --d1:#502630;
    --d2:#74363a;
    --d3:#954a49;
    --d4:#b06055;
    --d5:#c77a65;
    --rim:rgba(255,207,158,.6);
    --text:#f8e9da;
    --muted:rgba(248,233,218,.64);
    --caption:rgba(248,233,218,.78);
    --line:rgba(248,233,218,.28);
    --haze:rgba(255,160,100,.38);
    --scrim:rgba(30,10,32,.35);
    --shimmer:.65;
  }
  body[data-hour="night"]{
    --d1:#a2a7b5;
    --d2:#7f8597;
    --d3:#5d6479;
    --d4:#4a536b;
    --d5:#39425a;
    --rim:rgba(226,232,244,.55);
    --text:#e8ecf6;
    --muted:rgba(232,236,246,.58);
    --caption:rgba(232,236,246,.70);
    --line:rgba(232,236,246,.24);
    --haze:rgba(130,160,210,.18);
    --scrim:rgba(3,8,20,.45);
    --shimmer:.22;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  html{background:#cbd9df}
  body{
    min-height:100svh;
    color:var(--text);
    font-family:var(--sans);
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
    transition:color 1.2s ease;
  }
  ::selection{background:rgba(80,40,30,.9);color:#f7ead8}

  .scene{
    position:fixed;
    inset:0;
    overflow:hidden;
    z-index:0;
  }
  .sky-layer{
    position:absolute;
    inset:0;
    opacity:0;
    transition:opacity 1.35s ease;
  }
  .sky-day{
    background:
      radial-gradient(90% 60% at 66% 34%,rgba(255,250,232,.62),transparent 62%),
      linear-gradient(180deg,#b9d3e2 0%,#d3e3e5 34%,#eee6d3 66%,#f7edd9 100%);
  }
  .sky-dusk{
    background:
      radial-gradient(70% 45% at 62% 56%,rgba(255,154,84,.55),transparent 64%),
      linear-gradient(180deg,#221c45 0%,#4a2f61 30%,#8c4663 54%,#c8685c 70%,#e18a52 84%,#efa35c 100%);
  }
  .sky-night{
    background:
      radial-gradient(50% 32% at 74% 18%,rgba(173,193,231,.20),transparent 70%),
      linear-gradient(180deg,#04081a 0%,#0a122a 32%,#16213f 56%,#273452 78%,#39465f 100%);
  }
  body[data-hour="day"] .sky-day,
  body[data-hour="dusk"] .sky-dusk,
  body[data-hour="night"] .sky-night{opacity:1}

  .stars{
    position:absolute;
    inset:0;
    z-index:1;
    opacity:0;
    transition:opacity 1.4s ease;
    pointer-events:none;
  }
  body[data-hour="night"] .stars{opacity:1}
  .stars .tw{animation:twinkle 4.8s ease-in-out infinite alternate}
  .stars .tw:nth-child(3n){animation-delay:-1.7s}
  .stars .tw:nth-child(4n){animation-delay:-2.9s}
  @keyframes twinkle{from{opacity:.35}to{opacity:.95}}

  .sun{
    position:absolute;
    left:66%;
    top:34%;
    width:clamp(92px,12vw,170px);
    aspect-ratio:1;
    border-radius:50%;
    z-index:2;
    background:#fff3d8;
    box-shadow:
      0 0 70px 18px rgba(255,240,200,.42),
      0 0 220px 90px rgba(255,240,200,.18);
    transition:background-color 1.35s ease,box-shadow 1.35s ease,width 1.35s ease,top 1.35s ease,left 1.35s ease;
  }
  .sun::after{
    content:"";
    position:absolute;
    inset:0;
    border-radius:50%;
    background:
      radial-gradient(circle at 36% 42%,rgba(160,160,150,.20) 0 12%,transparent 13%),
      radial-gradient(circle at 62% 60%,rgba(160,160,150,.16) 0 8%,transparent 9%),
      radial-gradient(circle at 55% 30%,rgba(160,160,150,.14) 0 6%,transparent 7%);
    opacity:0;
    transition:opacity 1.2s ease;
  }
  body[data-hour="dusk"] .sun{
    left:62%;
    top:35%;
    width:clamp(112px,15.5vw,220px);
    background:#ff9a50;
    box-shadow:
      0 0 90px 26px rgba(255,140,70,.38),
      0 0 250px 110px rgba(255,120,70,.16);
  }
  body[data-hour="night"] .sun{
    left:75%;
    top:15%;
    width:clamp(46px,5vw,74px);
    background:#eef0e2;
    box-shadow:
      0 0 36px 10px rgba(195,208,236,.28),
      0 0 120px 46px rgba(145,172,220,.13),
      inset -7px -6px 0 rgba(160,172,196,.22);
  }
  body[data-hour="night"] .sun::after{opacity:1}

  .dune{
    position:absolute;
    left:-8%;
    width:116%;
    display:block;
    will-change:transform;
    pointer-events:none;
  }
  .dune path{transition:fill 1.35s ease}
  .dune .ridge{transition:stroke 1.35s ease}
  .d5{height:56vh;bottom:15vh;z-index:3}
  .d4{height:50vh;bottom:11vh;z-index:4}
  .d3{height:44vh;bottom:7vh;z-index:5}
  .d2{height:37vh;bottom:3vh;z-index:6}
  .d1{height:31vh;bottom:-1vh;z-index:7}

  .haze{
    position:absolute;
    left:-10%;
    right:-10%;
    top:40%;
    height:30%;
    z-index:8;
    pointer-events:none;
    background:linear-gradient(180deg,transparent,var(--haze) 54%,transparent);
    filter:blur(26px);
    mix-blend-mode:screen;
    transition:background-color 1.35s ease,opacity 1.2s ease;
  }
  .haze::before{
    content:"";
    position:absolute;
    left:8%;
    top:38%;
    width:46%;
    height:26%;
    border-radius:50%;
    background:var(--haze);
    filter:blur(22px);
    animation:drift 22s ease-in-out infinite alternate;
    opacity:.7;
  }
  .haze::after{
    content:"";
    position:absolute;
    right:6%;
    top:52%;
    width:38%;
    height:20%;
    border-radius:50%;
    background:var(--haze);
    filter:blur(28px);
    animation:drift 28s ease-in-out -8s infinite alternate-reverse;
    opacity:.5;
  }
  @keyframes drift{from{transform:translate3d(-4%,0,0)}to{transform:translate3d(6%,-2%,0)}}

  .shimmer{
    position:absolute;
    left:-6%;
    right:-6%;
    top:43%;
    height:20%;
    z-index:9;
    pointer-events:none;
    opacity:var(--shimmer);
    background:repeating-linear-gradient(0deg,rgba(255,255,255,.22) 0 1px,transparent 1px 6px);
    filter:blur(1.6px);
    mix-blend-mode:soft-light;
    -webkit-mask-image:linear-gradient(90deg,transparent 4%,#000 30%,#000 72%,transparent 96%);
    mask-image:linear-gradient(90deg,transparent 4%,#000 30%,#000 72%,transparent 96%);
    animation:shimmer 6.5s ease-in-out infinite alternate;
  }
  @keyframes shimmer{
    0%{transform:translate3d(-1.2%,0,0) skewX(0deg)}
    50%{opacity:calc(var(--shimmer) * 1.35)}
    100%{transform:translate3d(1.4%,-1.2%,0) skewX(.7deg)}
  }

  .scrim{
    position:absolute;
    left:0;right:0;bottom:0;
    height:46%;
    z-index:10;
    pointer-events:none;
    background:linear-gradient(180deg,transparent,var(--scrim) 78%);
    transition:background 1.35s ease;
  }
  .vignette{
    position:absolute;
    inset:0;
    z-index:10;
    pointer-events:none;
    background:radial-gradient(120% 90% at 50% 42%,transparent 55%,rgba(18,14,20,.22) 100%);
  }

  .grain{
    position:fixed;
    left:-50%;
    top:-50%;
    width:200%;
    height:200%;
    z-index:70;
    pointer-events:none;
    opacity:.09;
    mix-blend-mode:soft-light;
    animation:grainMove .7s steps(4) infinite;
  }
  @keyframes grainMove{
    0%{transform:translate3d(0,0,0)}
    25%{transform:translate3d(-1.2%,1.3%,0)}
    50%{transform:translate3d(1.4%,-1.1%,0)}
    75%{transform:translate3d(-1.1%,-1.4%,0)}
    100%{transform:translate3d(0,0,0)}
  }

  /* ── interface ───────────────────────────── */
  .ui{
    position:relative;
    z-index:20;
    min-height:100svh;
    display:flex;
    flex-direction:column;
    padding:clamp(18px,2.6vh,28px) clamp(20px,4.4vw,58px) clamp(16px,2.4vh,26px);
  }
  .hdr{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:18px;
    padding-bottom:clamp(12px,1.6vh,18px);
    border-bottom:1px solid var(--line);
    font-family:var(--mono);
    font-size:clamp(7.5px,.66vw,9.5px);
    letter-spacing:.2em;
    text-transform:uppercase;
    line-height:1.4;
    transition:border-color 1.2s ease;
    animation:fadeDown 1.1s cubic-bezier(.22,.7,.3,1) both;
  }
  .title-mark{display:inline-flex;align-items:center;gap:10px;color:var(--text)}
  .title-mark svg{width:13px;height:13px;display:block;opacity:.8}
  .title-mark b{font-weight:400;color:var(--muted);margin-left:2px}
  .hdr-meta{display:flex;align-items:center;gap:clamp(10px,2vw,28px);color:var(--muted)}
  .hdr-meta .sep{width:1px;height:10px;background:var(--line);display:inline-block}
  .hdr-meta .hide-sm{color:var(--text);opacity:.85}

  .stage{
    flex:1;
    display:flex;
    flex-direction:column;
    justify-content:flex-end;
    padding-bottom:clamp(18px,3vh,34px);
    min-height:0;
  }
  .statement{
    max-width:min(1080px,92%);
    animation:riseIn 1.3s cubic-bezier(.22,.7,.25,1) both;
    animation-delay:.12s;
  }
  .loc{
    display:flex;
    align-items:center;
    gap:11px;
    font-family:var(--mono);
    font-size:clamp(7.5px,.68vw,9.5px);
    letter-spacing:.24em;
    text-transform:uppercase;
    color:var(--muted);
    margin-bottom:clamp(12px,2vh,20px);
    transition:color 1.2s ease;
  }
  .loc .rule{width:clamp(24px,3.4vw,48px);height:1px;background:currentColor;opacity:.55}
  h1{
    margin:0;
    font-family:var(--serif);
    font-weight:400;
    font-size:clamp(3rem,9.2vw,9rem);
    line-height:.92;
    letter-spacing:-.035em;
    text-wrap:balance;
    transition:color 1.2s ease,text-shadow 1.2s ease;
  }
  h1 em{font-style:italic;letter-spacing:-.025em}
  body[data-hour="day"] h1{text-shadow:0 1px 0 rgba(255,255,255,.18)}
  body[data-hour="dusk"] h1{text-shadow:0 2px 34px rgba(45,8,32,.28)}
  body[data-hour="night"] h1{text-shadow:0 2px 40px rgba(10,20,45,.55)}
  .sci{
    margin:clamp(14px,2.2vh,24px) 0 0;
    font-family:var(--mono);
    font-size:clamp(8px,.72vw,10px);
    line-height:1.7;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--caption);
    max-width:98ch;
    transition:color 1.2s ease;
  }
  .sci .dot{opacity:.5;padding:0 .35em}
  .sci strong{font-weight:400;color:var(--text);opacity:.92}
  .cap-b{display:inline}

  .ftr{
    display:grid;
    grid-template-columns:auto auto 1fr auto;
    align-items:end;
    gap:clamp(16px,3vw,42px);
    padding-top:clamp(12px,1.8vh,18px);
    border-top:1px solid var(--line);
    transition:border-color 1.2s ease;
    animation:fadeUp 1.2s cubic-bezier(.22,.7,.3,1) both;
    animation-delay:.2s;
  }
  .fact{display:flex;flex-direction:column;gap:5px;min-width:0}
  .fact .k{
    font-family:var(--mono);
    font-size:clamp(6.5px,.55vw,8px);
    letter-spacing:.2em;
    text-transform:uppercase;
    color:var(--muted);
    white-space:nowrap;
  }
  .fact .v{
    font-family:var(--mono);
    font-size:clamp(8.5px,.78vw,10.5px);
    letter-spacing:.06em;
    color:var(--text);
    white-space:nowrap;
  }
  .fact.temp{justify-self:end;align-items:flex-end;text-align:right}
  .fact.temp .v{
    font-family:var(--serif);
    font-size:clamp(24px,2.6vw,34px);
    letter-spacing:-.02em;
    line-height:.9;
  }
  .hour-btn{
    appearance:none;
    border:1px solid var(--line);
    background:transparent;
    color:var(--text);
    font-family:var(--mono);
    font-size:clamp(8px,.7vw,9.5px);
    letter-spacing:.18em;
    text-transform:uppercase;
    padding:11px 14px;
    display:inline-flex;
    align-items:center;
    gap:11px;
    cursor:pointer;
    transition:background-color .4s ease,border-color .4s ease,color .6s ease;
    white-space:nowrap;
    min-height:40px;
  }
  .hour-btn:hover{background:color-mix(in srgb,var(--text) 9%,transparent);border-color:var(--text)}
  .hour-btn:focus-visible{outline:1px solid var(--text);outline-offset:3px}
  .dots{display:flex;gap:4px;align-items:center}
  .dots i{
    width:4px;height:4px;border-radius:50%;
    background:currentColor;
    opacity:.25;
    transition:opacity .35s ease,transform .35s ease;
  }
  .dots i.on{opacity:1;transform:scale(1.35)}
  .hour-btn .arrow{font-size:12px;opacity:.65;transition:transform .35s ease}
  .hour-btn:hover .arrow{transform:translateX(3px)}

  .sr-only{
    position:absolute;width:1px;height:1px;padding:0;margin:-1px;
    overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;
  }

  @keyframes riseIn{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
  @keyframes fadeDown{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
  @keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

  @media (max-width:820px){
    .ftr{grid-template-columns:auto auto 1fr;row-gap:14px}
    .fact.temp{justify-self:start;align-items:flex-start;text-align:left}
    .hour-btn{grid-column:1/-1;justify-content:center}
    .d5{bottom:20vh}
    .d4{bottom:15vh}
    .d3{bottom:10vh}
    .d2{bottom:5vh}
    .d1{bottom:0}
    h1{font-size:clamp(3rem,12vw,6rem)}
  }
  @media (max-width:560px){
    .ui{padding-left:18px;padding-right:18px}
    .hdr-meta .hide-sm{display:none}
    .hdr-meta{gap:10px}
    .statement{max-width:100%}
    .loc{letter-spacing:.18em;margin-bottom:12px}
    h1{font-size:clamp(2.7rem,13.8vw,4.4rem);line-height:.96}
    .sci{max-width:42ch;letter-spacing:.09em;line-height:1.8}
    .cap-b{display:block}
    .ftr{grid-template-columns:1fr auto;gap:12px 18px}
    .fact:nth-child(2){justify-self:end;text-align:right;align-items:flex-end}
    .fact.temp{grid-column:1;grid-row:2}
    .hour-btn{grid-column:2;grid-row:2;justify-self:end}
    .sun{left:70%;top:26%;width:clamp(64px,18vw,96px)}
    body[data-hour="dusk"] .sun{left:64%;top:36%;width:clamp(84px,26vw,140px)}
    body[data-hour="night"] .sun{left:74%;top:16%;width:clamp(40px,11vw,56px)}
  }
  @media (max-width:390px){
    .fact .v{font-size:8px}
    .hour-btn{padding:9px 11px;letter-spacing:.14em}
  }
  @media (max-height:620px){
    .loc{margin-bottom:8px}
    .sci{margin-top:8px}
    .stage{padding-bottom:10px}
    .hdr{padding-bottom:8px}
  }
  @media (prefers-reduced-motion:reduce){
    .statement,.hdr,.ftr,.stars .tw,.haze::before,.haze::after,.shimmer,.grain{animation:none}
    .sky-layer,.sun,.dune path,.dune .ridge,.h1{transition-duration:.01ms}
  }
</style>
</head>

    <div class="sky-layer sky-dusk"></div>
    <div class="sky-layer sky-night"></div>

    <svg class="stars" viewBox="0 0 1440 760" preserveAspectRatio="xMidYMid slice">

        <circle class="tw" cx="120" cy="96" r="1.2" opacity=".8"/>

    </svg>

    <div class="sun"></div>

    <svg class="dune d5" data-depth="5" viewBox="0 0 1440 500" preserveAspectRatio="none">
      <defs>
        <linearGradient id="duneShade5" x1="0" y1="0" x2="0" y2="1">
          <stop offset=".30" stop-color="#160e1e" stop-opacity="0"/>

          <stop offset="1" stop-color="#160e1e" stop-opacity=".30"/>
        </linearGradient>
      </defs>
      <path fill="var(--d5)" d="M0,190 C80,178 160,158 250,154 C360,148 440,172 530,184 C610,194 660,154 730,138 C800,122 860,134 920,160 C990,190 1060,196 1130,180 C1210,162 1300,146 1440,158 L1440,500 L0,500 Z"/>
      <path fill="url(#duneShade5)" d="M0,190 C80,178 160,158 250,154 C360,148 440,172 530,184 C610,194 660,154 730,138 C800,122 860,134 920,160 C990,190 1060,196 1130,180 C1210,162 1300,146 1440,158 L1440,500 L0,500 Z"/>

      <path class="ridge" fill="none" stroke="var(--rim)" stroke-width="1.2" opacity=".40" d="M0,190 C80,178 160,158 250,154 C360,148 440,172 530,184 C610,194 660,154 730,138 C800,122 860,134 920,160 C990,190 1060,196 1130,180 C1210,162 1300,146 1440,158"/>
    </svg>

    <svg class="dune d4" data-depth="10" viewBox="0 0 1440 500" preserveAspectRatio="none">
      <defs>
        <linearGradient id="duneShade4" x1="0" y1="0" x2="0" y2="1">
          <stop offset=".30" stop-color="#160e1e" stop-opacity="0"/>
          <stop offset=".74" stop-color="#160e1e" stop-opacity=".13"/>
          <stop offset="1" stop-color="#160e1e" stop-opacity=".31"/>
        </linearGradient>
      </defs>
      <path fill="var(--d4)" d="M0,252 C90,224 180,214 270,224 C350,233 420,258 480,262 C530,265 570,238 620,222 C700,196 770,204 830,226 C900,252 950,268 1020,262 C1110,254 1180,226 1260,214 C1330,204 1390,214 1440,222 L1440,500 L0,500 Z"/>

  <script>
    (function(){
      "use strict";
      var body = document.body;
      var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      /* ── palette cycle ─────────────────────── */
      var hours = [
        {
          key: "day",
          label: "Day",
          temp: "24°C",
          sky: "Clear · Day",
          caption: "Sand <strong>31°C</strong><span class=\"dot\">·</span>Wind 12 km/h NE<span class=\"dot\">·</span><span class=\"cap-b\">Visibility 9.4 km<span class=\"dot\">·</span>Solar alt. 61.4°</span>",
          announce: "Day. Clear skies, twenty-four degrees."
        },
        {
          key: "dusk",
          label: "Dusk",
          temp: "16°C",
          sky: "Clear · Dusk",
          caption: "Sand <strong>22°C</strong><span class=\"dot\">·</span>Wind 18 km/h SW<span class=\"dot\">·</span><span class=\"cap-b\">Visibility 6.1 km<span class=\"dot\">·</span>Solar alt. 08.2°</span>",
          announce: "Dusk. Burnt orange horizon, sixteen degrees."
        },
        {
          key: "night",
          label: "Night",
          temp: "04°C",
          sky: "Clear · Night",
          caption: "Sand <strong>07°C</strong><span class=\"dot\">·</span>Wind 06 km/h S<span class=\"dot\">·</span><span class=\"cap-b\">Visibility 14.8 km<span class=\"dot\">·</span>Lunar alt. 34.6°</span>",
          announce: "Night. Indigo sky, four degrees."
        }
      ];
      var index = 0;
      var btn = document.getElementById("hourBtn");
      var hourLabel = document.getElementById("hourLabel");
      var tempEl = document.getElementById("temp");
      var skyEl = document.getElementById("skyLabel");
      var captionEl = document.getElementById("caption");
      var statusEl = document.getElementById("hourStatus");
      var dots = Array.prototype.slice.call(document.querySelectorAll(".dots i"));

      function apply(index){
        var h = hours[index];
        body.setAttribute("data-hour", h.key);
        hourLabel.textContent = h.label;
        tempEl.textContent = h.temp;
        skyEl.textContent = h.sky;
        captionEl.innerHTML = h.caption;
        dots.forEach(function(dot, i){ dot.classList.toggle("on", i === index); });
        btn.setAttribute("aria-label", "Change time of day. Currently " + h.label.toLowerCase() + ".");
        statusEl.textContent = h.announce;
      }

      btn.addEventListener("click", function(){
        index = (index + 1) % hours.length;
        apply(index);
      });

      /* ── pointer parallax ──────────────────── */
      var layers = Array.prototype.slice.call(document.querySelectorAll(".dune"));
      var targetX = 0, targetY = 0, currentX = 0, currentY = 0;
      var running = false;

      function render(){
        currentX += (targetX - currentX) * 0.055;
        currentY += (targetY - currentY) * 0.055;
        layers.forEach(function(layer){
          var depth = parseFloat(layer.getAttribute("data-depth")) || 0;
          var x = (currentX * depth).toFixed(2);
          var y = (currentY * depth * 0.32).toFixed(2);
          layer.style.transform = "translate3d(" + x + "px," + y + "px,0)";
        });
        if(Math.abs(targetX-currentX) > 0.0005 || Math.abs(targetY-currentY) > 0.0005){
          requestAnimationFrame(render);
        } else {
          running = false;
        }
      }

      function kick(){
        if(!running && !reduce){
          running = true;
          requestAnimationFrame(render);
        }
      }

      window.addEventListener("pointermove", function(e){
        if(e.pointerType === "touch") return;
        targetX = (e.clientX / window.innerWidth - 0.5) * 2;
        targetY = (e.clientY / window.innerHeight - 0.5) * 2;
        kick();
      }, {passive:true});

      window.addEventListener("pointerleave", function(){
        targetX = 0; targetY = 0; kick();
      });

      if(reduce) apply(0);
    })();
  </script>
